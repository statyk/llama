[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-radio"
version = "0.1.0"
description = "Live Music Archive -> automated radio station pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mutagen>=1.47",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llama = "llama.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network or LLM; deselected by default"]
addopts = "-m 'not live'"
