<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title · $station</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="$station">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$page_url">
$og_image_html
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/radio.css">
<script type="module" src="/assets/show.js"></script>
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="brand">$station</h1>
    <p class="tag"><a href="/">← back to the station</a></p>
  </header>

  <section class="bigt">
    <div class="bstub">$date_stub<b class="year">$year_stub</b>GEN ADM<br>LMA RADIO</div>
    <div class="bmain">
      <span class="presents">LMA RADIO PRESENTS</span>
      <h2>$artist</h2>
      <div class="w">$where</div>
      $archive_html
    </div>
  </section>

  <div class="cols">
    <div>
      <h2 class="kick">Setlist</h2>
      <div class="jcard">
$setlist_html
      </div>
      <div class="meta">
        <b class="label">On the air</b>
        <div id="airtimes" data-slug="$slug">Loading…</div>
        <div id="zone"></div>
      </div>
      $lineage
    </div>
    <div>
      <h2 class="kick">Liner notes</h2>
      <div class="liner">
$sections_html
      </div>
    </div>
  </div>

  <p class="fineprint">Show notes are AI generated and may contain mistakes.</p>
</main>
</body>
</html>
