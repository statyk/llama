<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LMA Radio probe</title>

<style>
  body { font: 16px system-ui, sans-serif; margin: 12px; }
  button { display: block; width: 100%; padding: 16px; margin: 8px 0; font-size: 18px; }
  a { display: block; padding: 16px 0; font-size: 18px; }
  #status { font-weight: bold; min-height: 1.3em; }
  #copybox { width: 100%; height: 30vh; font: 11px ui-monospace, monospace; }
  #log { font: 11px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>

<body>
<audio id="audio" preload="none"></audio>
<button id="start" type="button">Start</button>
<button id="stop" type="button">Stop (teardown)</button>
<button id="pause" type="button">Pause only</button>
<button id="retry" type="button">Retry loop: off</button>
<button id="push" type="button">history.pushState</button>
<a id="archive" target="_blank" href="https://archive.org/details/etree">archive.org (new tab)</a>
<button id="copy" type="button">Copy log</button>
<p id="status"></p>
<textarea id="copybox" readonly hidden></textarea>
<pre id="log"></pre>
<script src="probe.js"></script>
</body>
