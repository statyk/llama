<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LMA Radio</title>
<meta property="og:type" content="website">
<meta property="og:title" content="LMA Radio">
<meta property="og:description" content="Live concert tapes from the Live Music Archive, around the clock.">
<meta property="og:image" content="https://listen.lma-radio.com/assets/cassette-og.png">
<meta name="theme-color" content="#e9dfc8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LMA Radio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="assets/radio.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/radio.css">
<script src="assets/hls.min.js" defer></script>
<script type="module" src="assets/app.js"></script>
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="brand">LMA Radio</h1>
    <p class="tag">Live concert tapes from the Live Music Archive, around the clock.</p>
  </header>

  <section class="band">
    <div class="cass">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <div class="clabel">
        <div class="ln"><span>LMA RADIO</span><span id="label-status">ON THE AIR</span></div>
        <div id="label-artist" class="hand h1">LMA Radio</div>
        <div id="label-where" class="hand h2"></div>
        <div id="label-date" class="hand h3"></div>
      </div>
      <div id="hubs" class="window">
        <div class="pack l"></div><div class="pack r"></div>
        <div class="hub"></div><div class="hub"></div>
      </div>
      <div class="trap"></div>
    </div>

    <div class="deck">
      <div class="keys">
        <button id="play" class="key on" type="button">Play</button>
        <button id="stop" class="key" type="button">Stop</button>
      </div>
      <div class="playing">
        <h2 class="kick">Now playing</h2>
        <p id="now" class="np">LMA Radio</p>
        <button id="retry" class="key retry" type="button" hidden>Try again</button>
      </div>
      <div class="tape-log">
        <h2 class="kick">Tape log</h2>
        <ol id="tape-log" class="log"></ol>
      </div>
    </div>
  </section>

  <section class="schedule">
    <div class="sched-head">
      <h2 class="kick">Coming up</h2>
      <p id="zone" class="zone"></p>
    </div>
    <p id="schedule-note" class="schedule-note" hidden></p>
    <div id="coming-up" class="tickets"></div>
  </section>

  <section class="schedule">
    <h2 class="kick">Just aired</h2>
    <div id="just-aired" class="tickets"></div>
  </section>

  <footer class="foot">
    <p>Recordings from the <a href="https://archive.org/details/etree">Live Music Archive</a>.
       Non-commercial; no ads.</p>
    <p>Stream URL (VLC, apps): <code id="stream-url"></code></p>
  </footer>

  <audio id="audio" preload="none"></audio>
</main>
</body>
</html>
