name: release

# Build llama's four self-contained binaries on GitHub-hosted runners and
# attach them to a GitHub Release. The macOS and Windows binaries are signed by
# packaging/build.py using credentials stored as GitHub Actions secrets: a
# Developer ID `.p12` + notary Apple-ID credentials for macOS, and Azure
# Trusted Signing service-principal credentials for Windows. Linux is
# unsigned (verify via SHA256SUMS). PyInstaller does not cross-compile, so
# each artifact is built on native hardware. Note: the linux/arm64 leg uses
# `ubuntu-24.04-arm`, which requires this repository to be public. See
# docs/releasing.md for background.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (required for manual runs)."
        required: false
        type: string
      dry_run:
        description: "Plan only — run build.py in dry-run mode; no artifacts, no release."
        type: boolean
        default: false
      skip_release:
        description: "Full rehearsal: build + sign for real and upload artifacts, but skip creating the GitHub Release."
        type: boolean
        default: false

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      skip_release: ${{ steps.resolve.outputs.skip_release }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_SKIP: ${{ inputs.skip_release }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            ver="${REF_NAME#v}"; dry="false"; skip="false"
          else
            ver="$IN_VERSION"; dry="${IN_DRY:-false}"; skip="${IN_SKIP:-false}"
          fi
          if [ -z "$ver" ]; then
            echo "::error::version is required (push a v* tag or pass the version input)"; exit 1
          fi
          # Strict allowlist — neutralises shell metacharacters a crafted tag could carry.
          if ! printf '%s' "$ver" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "::error::version '$ver' contains disallowed characters"; exit 1
          fi
          {
            echo "version=$ver"
            echo "dry_run=$dry"
            echo "skip_release=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$ver dry_run=$dry skip_release=$skip"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x64,   runner: ubuntu-latest,      timeout: 30 }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm,   timeout: 30 }
          - { os: macos,   arch: arm64, runner: macos-latest,       timeout: 45 }
          - { os: windows, arch: x64,   runner: windows-latest,     timeout: 30 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up project
        shell: bash
        run: |
          set -euo pipefail
          # Windows exposes `python`/`python3` as Microsoft Store alias stubs
          # that error out; pick an interpreter that actually runs, preferring
          # `python`, then `python3`, then the alias-proof `py` launcher.
          PY=""
          for c in python python3 py; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys' >/dev/null 2>&1; then
              PY="$c"; break
            fi
          done
          [ -n "$PY" ] || { echo "::error::no working python interpreter found on runner"; exit 1; }
          echo "using interpreter: $PY ($("$PY" -c 'import sys; print(sys.version.split()[0])'))"
          "$PY" -m venv .venv
          . .venv/bin/activate 2>/dev/null || . .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Prepare macOS signing
        if: matrix.os == 'macos' && needs.prep.outputs.dry_run != 'true'
        shell: bash
        env:
          LLAMA_SIGNING_P12_BASE64: ${{ secrets.LLAMA_SIGNING_P12_BASE64 }}
        run: |
          set -euo pipefail
          p12_path="$RUNNER_TEMP/signing.p12"
          printf '%s' "$LLAMA_SIGNING_P12_BASE64" | base64 --decode > "$p12_path"
          [ -s "$p12_path" ] || { echo "::error::decoded signing.p12 is empty"; exit 1; }
          {
            echo "LLAMA_SIGNING_P12=$p12_path"
            echo "LLAMA_SIGNING_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"
      - name: Install Trusted Signing dlib
        if: matrix.os == 'windows' && needs.prep.outputs.dry_run != 'true'
        shell: pwsh
        run: |
          # Download the .nupkg (a zip) directly and extract it: nuget.exe's
          # classic `install` intermittently reports "Unable to find package"
          # against the v3 feed even when the package resolves. Pinned for a
          # reproducible signing toolchain — bump when Microsoft ships a fix.
          $ErrorActionPreference = "Stop"
          $ver = "1.0.95"
          $nupkg = "$env:RUNNER_TEMP\tsc.zip"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.trusted.signing.client/$ver/microsoft.trusted.signing.client.$ver.nupkg" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath "$env:RUNNER_TEMP\tsc" -Force
          $dest = "$env:LOCALAPPDATA\Microsoft\MicrosoftArtifactSigningClientTools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\tsc\bin\x64\*" -Destination $dest -Recurse -Force
      - name: Build
        shell: bash
        env:
          VER: ${{ needs.prep.outputs.version }}
          DRY: ${{ needs.prep.outputs.dry_run }}
          LLAMA_CODESIGN_IDENTITY: ${{ matrix.os == 'macos' && secrets.LLAMA_CODESIGN_IDENTITY || '' }}
          LLAMA_SIGNING_P12_PASSWORD: ${{ matrix.os == 'macos' && secrets.LLAMA_SIGNING_P12_PASSWORD || '' }}
          LLAMA_NOTARY_APPLE_ID: ${{ matrix.os == 'macos' && secrets.LLAMA_NOTARY_APPLE_ID || '' }}
          LLAMA_NOTARY_PASSWORD: ${{ matrix.os == 'macos' && secrets.LLAMA_NOTARY_PASSWORD || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          . .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          if [ "$DRY" = "true" ]; then
            python packaging/build.py --version "$VER" --dry-run
          else
            python packaging/build.py --version "$VER"
          fi
      - uses: actions/upload-artifact@v7
        if: needs.prep.outputs.dry_run != 'true'
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          # Artifacts are only a short-lived handoff to the release job below,
          # which attaches them to the GitHub Release; 1 day is plenty.
          retention-days: 1

  release:
    needs: [prep, build]
    if: needs.prep.outputs.dry_run != 'true' && needs.prep.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum llama-* > SHA256SUMS
          echo "=== SHA256SUMS ==="; cat SHA256SUMS
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VER" \
            --title "v$VER" \
            --notes "llama $VER — self-contained binaries. Verify with SHA256SUMS." \
            dist-release/llama-* dist-release/SHA256SUMS
