[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-herder"
version = "0.1.0"
description = "Shared LLM task layer: tiered providers, schema-validated tasks, retry escalation"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/herder"]
