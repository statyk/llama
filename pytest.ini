[pytest]
testpaths = packages/herder/tests packages/llama/tests packages/emcee/tests packages/transmitter/tests_transmitter scripts
markers =
    live: hits real network or LLM; deselected by default
    real_model: loads the bundled YAMNet ONNX model with onnxruntime; skipped when onnxruntime is missing
addopts = -m 'not live'
